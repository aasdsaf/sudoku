<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>數獨解題</title>
<style>
:root{--bg:#f4f5f7;--fg:#1f2937;--card:#fff;--line:#9ca3af;--thick:#1f2937;--acc:#2563eb;--sel:#dbeafe}
@media(prefers-color-scheme:dark){:root{--bg:#111827;--fg:#f3f4f6;--card:#1f2937;--line:#4b5563;--thick:#d1d5db;--acc:#60a5fa;--sel:#1e3a8a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,-apple-system,"Noto Sans TC",sans-serif;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
main{max-width:520px;margin:0 auto;padding:12px 0}
h1{font-size:20px;margin:4px 0 8px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--card);color:var(--fg);box-shadow:0 0 0 1px var(--line) inset}
button.p{background:var(--acc);color:#fff;box-shadow:none}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
#pad button{flex:1;padding:12px 0;min-width:0}
#msg{min-height:1.4em;margin:6px 0}
#prev{width:100%;border-radius:8px;margin-bottom:10px}
#grid{display:grid;grid-template-columns:repeat(9,1fr);width:100%;aspect-ratio:1;background:var(--card);border:2px solid var(--thick)}
.c{display:flex;align-items:center;justify-content:center;font-size:clamp(18px,6vw,30px);border:.5px solid var(--line);user-select:none}
.r3{border-right:2px solid var(--thick)}.b3{border-bottom:2px solid var(--thick)}
.sel{background:var(--sel)}.low{background:#f59e0b66}.bad{color:#dc2626;font-weight:700}.sol{color:var(--acc)}
</style>
</head>
<body>
<main>
<h1>數獨解題</h1>
<div class="row"><button class="p" id="pick">選擇截圖 / 拍照</button><button id="manual">手動框選</button><input id="file" type="file" accept="image/*" hidden></div>
<div id="msg">選一張數獨截圖，或在相簿用「分享」傳進來。</div>
<canvas id="prev" hidden></canvas>
<div id="grid"></div>
<div class="row" id="pad"></div>
<div class="row"><button class="p" id="solve">解題</button><button id="clr">清除解答</button><button id="rst">全部清空</button></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js" crossorigin="anonymous"></script>
<script>
const $=s=>document.querySelector(s), msg=t=>$('#msg').textContent=t;
let v=Array(81).fill(0), solved=null, low=new Set(), sel=-1, worker=null;

/* ---------- 解題 ---------- */
const units=[];
for(let i=0;i<9;i++){
  units.push([...Array(9)].map((_,k)=>i*9+k),[...Array(9)].map((_,k)=>k*9+i));
  const br=(i/3|0)*3,bc=(i%3)*3;
  units.push([...Array(9)].map((_,k)=>(br+(k/3|0))*9+bc+k%3));
}
function conflicts(b){
  const s=new Set();
  for(const u of units)for(let a=0;a<9;a++)for(let k=a+1;k<9;k++){
    const x=u[a],y=u[k]; if(b[x]&&b[x]===b[y]){s.add(x);s.add(y)}
  }
  return s;
}
function solve(b){
  const a=b.slice(),R=Array(9).fill(0),C=Array(9).fill(0),B=Array(9).fill(0);
  for(let i=0;i<81;i++)if(a[i]){
    const m=1<<a[i],r=i/9|0,c=i%9,k=(r/3|0)*3+(c/3|0);
    if((R[r]|C[c]|B[k])&m)return{n:0}; R[r]|=m;C[c]|=m;B[k]|=m;
  }
  let n=0,first=null;
  (function go(){
    if(n>1)return;
    let bi=-1,bm=0,bc=10;
    for(let i=0;i<81;i++)if(!a[i]){
      const r=i/9|0,c=i%9,k=(r/3|0)*3+(c/3|0),m=~(R[r]|C[c]|B[k])&0x3fe;
      let cnt=0;for(let t=m;t;t&=t-1)cnt++;
      if(cnt<bc){bc=cnt;bi=i;bm=m;if(cnt<2)break}
    }
    if(bi<0){n++;if(!first)first=a.slice();return}
    if(!bc)return;
    const r=bi/9|0,c=bi%9,k=(r/3|0)*3+(c/3|0);
    for(let d=1;d<10;d++){
      const m=1<<d; if(!(bm&m))continue;
      a[bi]=d;R[r]|=m;C[c]|=m;B[k]|=m; go(); R[r]&=~m;C[c]&=~m;B[k]&=~m;a[bi]=0;
      if(n>1)return;
    }
  })();
  return{n,sol:first};
}

/* ---------- 介面 ---------- */
function render(){
  const bad=conflicts(v),g=$('#grid'); g.innerHTML='';
  for(let i=0;i<81;i++){
    const r=i/9|0,c=i%9,d=document.createElement('div');
    d.className='c'+(c%3==2&&c<8?' r3':'')+(r%3==2&&r<8?' b3':'')+(i==sel?' sel':'')+
      (low.has(i)?' low':'')+(bad.has(i)?' bad':'')+(!v[i]&&solved?' sol':'');
    d.textContent=v[i]||(solved?solved[i]:'');
    d.onclick=()=>{sel=i;render()};
    g.append(d);
  }
}
for(let n=1;n<=9;n++){const b=document.createElement('button');b.textContent=n;b.onclick=()=>setCell(n);$('#pad').append(b)}
const del=document.createElement('button');del.textContent='⌫';del.onclick=()=>setCell(0);$('#pad').append(del);
function setCell(n){if(sel<0)return;v[sel]=n;low.delete(sel);solved=null;render()}
$('#solve').onclick=()=>{
  const bad=conflicts(v); if(bad.size){msg('有重複的數字（紅色），請先修正');return}
  const r=solve(v);
  if(!r.n){msg('無解，請檢查辨識錯誤的格子（橘色是不確定的）');return}
  solved=r.sol; msg(r.n>1?'有多組解（題目數字可能不完整），先顯示其中一組':'解出來了！藍色是解答'); render();
};
$('#clr').onclick=()=>{solved=null;render()};
$('#rst').onclick=()=>{v.fill(0);solved=null;low.clear();sel=-1;$('#prev').hidden=true;msg('');render()};
$('#pick').onclick=()=>$('#file').click();
$('#file').onchange=e=>e.target.files[0]&&loadBlob(e.target.files[0]);
addEventListener('paste',e=>{const f=e.clipboardData&&e.clipboardData.files[0];if(f)loadBlob(f)});

/* ---------- 偵測盤面（等距格線擬合） ---------- */
function prof(g,W,H,vert){
  const n=vert?W:H,m=vert?H:W,P=new Float64Array(n);
  for(let p=1;p<n-1;p++){
    let s=0;
    for(let q=0;q<m;q++){
      const d=Math.abs(vert?g[q*W+p-1]-g[q*W+p+1]:g[(p-1)*W+q]-g[(p+1)*W+q]);
      if(d>6)s+=d>30?30:d;
    }
    P[p]=s;
  }
  return P;
}
function fit(P,smin,smax){
  let best={sc:0},L=P.length;
  for(let s=Math.max(8,smin);s<=smax;s++)for(let p=0;p+9*s<L;p++){
    let sc=0;
    for(let k=0;k<10;k++){let m=0;for(let d=-2;d<=2;d++){const t=P[p+k*s+d]||0;if(t>m)m=t}sc+=m}
    if(sc>best.sc)best={sc,p,s};
  }
  if(best.sc){let mid=0;for(let k=0;k<9;k++)mid+=P[best.p+k*best.s+(best.s>>1)];best.ratio=(best.sc/10)/(mid/9+1)}
  return best;
}
function findBoard(g,W,H){
  const PX=prof(g,W,H,true),PY=prof(g,W,H,false);let fx,fy;
  if(W<=H){fx=fit(PX,Math.floor(W*.05),Math.floor(W/9));fy=fit(PY,fx.s-2,fx.s+2)}
  else{fy=fit(PY,Math.floor(H*.05),Math.floor(H/9));fx=fit(PX,fy.s-2,fy.s+2)}
  if(!(fx.ratio>2&&fy.ratio>2))return null;
  return{x:fx.p,y:fy.p,s:(fx.s+fy.s)/2};
}

/* ---------- 辨識 ---------- */
let img=null;
async function getWorker(){
  if(worker)return worker;
  worker=await Tesseract.createWorker('eng');
  await worker.setParameters({tessedit_char_whitelist:'123456789',tessedit_pageseg_mode:'10'});
  return worker;
}
function drawBase(){$('#prev').getContext('2d').putImageData(img.base,0,0)}
async function loadBlob(blob){
  msg('讀取圖片…');
  const bmp=await createImageBitmap(blob), sc=Math.min(1,1200/Math.max(bmp.width,bmp.height));
  const W=Math.round(bmp.width*sc),H=Math.round(bmp.height*sc),cv=$('#prev');
  cv.width=W;cv.height=H;const x=cv.getContext('2d',{willReadFrequently:true});x.drawImage(bmp,0,0,W,H);
  const base=x.getImageData(0,0,W,H),px=base.data,g=new Uint8Array(W*H);
  for(let i=0;i<W*H;i++)g[i]=.299*px[i*4]+.587*px[i*4+1]+.114*px[i*4+2];
  img={g,W,H,base,tap:[]};cv.hidden=false;
  msg('尋找九宮格…'); await new Promise(r=>setTimeout(r,30));
  const box=findBoard(g,W,H);
  if(box)return readBoard(box);
  msg('沒自動找到九宮格。請在上方圖片依序點「九宮格左上角」和「右下角」。');
}
$('#prev').onclick=e=>{
  if(!img)return;
  const cv=e.target,r=cv.getBoundingClientRect(),x=cv.getContext('2d');
  const pt=[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height];
  img.tap.push(pt);x.fillStyle='#ef4444';x.beginPath();x.arc(pt[0],pt[1],Math.max(5,cv.width/80),0,7);x.fill();
  if(img.tap.length<2){msg('再點「九宮格右下角」');return}
  const[[a,b],[c,d]]=img.tap;img.tap=[];const s=((c-a)+(d-b))/18;
  if(s<8){drawBase();msg('位置不對，請重新點：先左上角，再右下角');return}
  readBoard({x:a,y:b,s});
};
$('#manual').onclick=()=>{if(img){img.tap=[];drawBase();msg('請在上方圖片依序點九宮格的左上角和右下角')}};
async function readBoard(box){
  const{g,W,H}=img;
  v.fill(0);solved=null;low.clear();sel=-1;render();drawBase();
  const x=$('#prev').getContext('2d');x.strokeStyle='#ef4444';x.lineWidth=Math.max(3,W/200);x.strokeRect(box.x,box.y,box.s*9,box.s*9);
  const w=await getWorker(),cells=[];
  const t=document.createElement('canvas'),t2=document.createElement('canvas');t2.width=t2.height=72;
  for(let i=0;i<81;i++){
    const r=i/9|0,c=i%9,m=Math.round(box.s*.7),x0=Math.round(box.x+c*box.s+box.s*.15),y0=Math.round(box.y+r*box.s+box.s*.15);
    if(x0<0||y0<0||x0+m>W||y0+m>H)continue;
    let bg=0,nb=0;
    for(let k=0;k<m;k++){for(const [a,b] of [[k,0],[k,m-1],[0,k],[m-1,k]]){bg+=g[(y0+b)*W+x0+a];nb++}}
    bg/=nb;
    const bin=new ImageData(m,m);let ink=0;
    for(let yy=0;yy<m;yy++)for(let xx=0;xx<m;xx++){
      const on=Math.abs(g[(y0+yy)*W+x0+xx]-bg)>70,o=(yy*m+xx)*4;
      bin.data[o]=bin.data[o+1]=bin.data[o+2]=on?0:255;bin.data[o+3]=255;if(on)ink++;
    }
    if(ink/(m*m)<.03)continue;
    t.width=t.height=m;t.getContext('2d').putImageData(bin,0,0);
    const c2=t2.getContext('2d');c2.fillStyle='#fff';c2.fillRect(0,0,72,72);c2.drawImage(t,12,12,48,48);
    cells.push([i,await w.recognize(t2)]);
    msg(`辨識中… ${cells.length}`);
  }
  for(const [i,res] of cells){
    const d=res.data.text.trim()[0];
    if(d&&d>='1'&&d<='9'){v[i]=+d;if(res.data.confidence<60)low.add(i)}else low.add(i);
  }
  msg(`辨識完成，共 ${cells.length} 格有數字。橘色是不確定的，點格子再按數字可修正。框的位置不對可按「手動框選」重來。`);render();
}

/* ---------- 啟動 ---------- */
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
if(location.search.includes('shared')){
  history.replaceState(null,'',location.pathname);
  caches.open('shared').then(c=>c.match('shared-image')).then(r=>r&&r.blob()).then(b=>b&&loadBlob(b));
}
</script>
</body>
</html>
