<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>數獨解題</title>
<style>
/* 想改顏色：改這裡的色碼就好（上面是淺色模式，下面 dark 那行是深色模式） */
:root{--bg:#f1f2f4;--fg:#2b303a;--card:#fff;--line:#b5bac4;--thick:#2b303a;--btn:#456aa3;--sol:#456aa3;--sel:#dfe7f5;--low:#f3deb0;--hint:#cfe8da;--bad:#c0444f;--given:#e7e9ee;--peer:#e9eef7;--same:#f5e6a8}
@media(prefers-color-scheme:dark){:root{--bg:#15181e;--fg:#dfe3ea;--card:#1e222a;--line:#3d4452;--thick:#9aa3b2;--btn:#3b5683;--sol:#8ea8d2;--sel:#2a3650;--low:#5a4a2a;--hint:#27483b;--bad:#e08a92;--given:#2a2f3a;--peer:#222a38;--same:#6b5a2a}
#prev{filter:brightness(.82)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,-apple-system,"Noto Sans TC",sans-serif;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
main{max-width:520px;margin:0 auto;padding:12px 0}
h1{font-size:22px;margin:4px 0 8px}
button{font:inherit;font-size:17px;border:0;border-radius:12px;padding:12px 16px;min-height:46px;background:var(--card);color:var(--fg);box-shadow:0 0 0 1px var(--line) inset}
button.p{background:var(--btn);color:#fff;box-shadow:none}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.row button{flex:1 1 auto}
#pad button{flex:1;padding:12px 0;min-width:0;font-size:21px}
#msg{min-height:1.5em;margin:8px 0}
#prev{width:100%;border-radius:8px;margin-bottom:10px}
#grid{display:grid;grid-template-columns:repeat(9,1fr);width:100%;aspect-ratio:1;background:var(--card);border:2px solid var(--thick)}
.c{display:flex;align-items:center;justify-content:center;font-size:clamp(18px,6vw,30px);border:.5px solid var(--line);user-select:none}
.r3{border-right:2px solid var(--thick)}.b3{border-bottom:2px solid var(--thick)}
.g{background:var(--given);font-weight:700}.ent{color:var(--sol)}.peer{background:var(--peer)}.g.peer{background:var(--given);box-shadow:inset 0 0 0 100px #4a6ea81a}
.same{background:var(--same);font-weight:700}.dim{opacity:.35}.hint{background:var(--hint)}.low{background:var(--low)}.bad{color:var(--bad);font-weight:700}.sel{background:var(--sel)}
.seg{display:flex;margin:10px 0 0;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px var(--line) inset}.seg button{flex:1;border-radius:0;box-shadow:none;background:transparent}
.seg button.on,#pad button.on{background:var(--btn);color:#fff}
#recs{background:var(--card);border-radius:12px;padding:10px 12px;margin-top:10px}
#recs select{font:inherit;font-size:17px;min-height:46px;border-radius:12px;padding:0 10px;background:var(--bg);color:var(--fg);border:1px solid var(--line)}
#rl{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.rc{display:flex;flex-direction:column;gap:6px;background:var(--bg);border-radius:10px;padding:8px}
.rc img{width:100%;border-radius:6px}.rc .nm{font-weight:600;word-break:break-all}
.st.ok{color:#5aa77a}.st.check{color:#d6a24a}.st.new{opacity:.7}.rc button{min-height:40px;padding:8px}
</style>
</head>
<body>
<main>
<h1>數獨解題</h1>
<div class="row"><button class="p" id="pick">選擇截圖</button><button class="p" id="camBtn">拍照</button><button id="manual">手動框選</button><input id="file" type="file" accept="image/*" multiple hidden><input id="cam" type="file" accept="image/*" capture="environment" hidden></div>
<div id="msg">選一張數獨截圖，或在相簿用「分享」傳進來。</div>
<canvas id="prev" hidden></canvas>
<div id="grid"></div>
<div class="seg"><button id="mIn" class="on">輸入</button><button id="mHl">突顯數字</button></div>
<div class="row" id="pad"></div>
<div class="row"><button class="p" id="solve">解題</button><button id="hintBtn">提示</button><button id="copy">複製</button><button id="clr">清除解答</button><button id="rst">全部清空</button><button id="histBtn">紀錄</button></div>
<div id="recs" hidden><div class="row"><select id="sort"><option value="u">最新</option><option value="n">名稱</option><option value="s">狀態</option></select><button id="exp">匯出</button><button id="imp">匯入</button><input id="impf" type="file" accept=".json,application/json" hidden></div><div id="rl"></div></div>
</main>
<script src="vendor/tesseract.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';document.head.append(s)"></script>
<script>
const $=s=>document.querySelector(s), msg=t=>$('#msg').textContent=t;
let v=Array(81).fill(0), hint=-1, solved=null, fx=new Set(), hl=0, mode='in', low=new Set(), sel=-1, worker=null;

/* ---------- 解題 ---------- */
const units=[];
for(let i=0;i<9;i++){
  units.push([...Array(9)].map((_,k)=>i*9+k),[...Array(9)].map((_,k)=>k*9+i));
  const br=(i/3|0)*3,bc=(i%3)*3;
  units.push([...Array(9)].map((_,k)=>(br+(k/3|0))*9+bc+k%3));
}
function conflicts(b){
  const s=new Set();
  for(const u of units)for(let a=0;a<9;a++)for(let k=a+1;k<9;k++){
    const x=u[a],y=u[k]; if(b[x]&&b[x]===b[y]){s.add(x);s.add(y)}
  }
  return s;
}
function solve(b){
  const a=b.slice(),R=Array(9).fill(0),C=Array(9).fill(0),B=Array(9).fill(0);
  for(let i=0;i<81;i++)if(a[i]){
    const m=1<<a[i],r=i/9|0,c=i%9,k=(r/3|0)*3+(c/3|0);
    if((R[r]|C[c]|B[k])&m)return{n:0}; R[r]|=m;C[c]|=m;B[k]|=m;
  }
  let n=0,first=null;
  (function go(){
    if(n>1)return;
    let bi=-1,bm=0,bc=10;
    for(let i=0;i<81;i++)if(!a[i]){
      const r=i/9|0,c=i%9,k=(r/3|0)*3+(c/3|0),m=~(R[r]|C[c]|B[k])&0x3fe;
      let cnt=0;for(let t=m;t;t&=t-1)cnt++;
      if(cnt<bc){bc=cnt;bi=i;bm=m;if(cnt<2)break}
    }
    if(bi<0){n++;if(!first)first=a.slice();return}
    if(!bc)return;
    const r=bi/9|0,c=bi%9,k=(r/3|0)*3+(c/3|0);
    for(let d=1;d<10;d++){
      const m=1<<d; if(!(bm&m))continue;
      a[bi]=d;R[r]|=m;C[c]|=m;B[k]|=m; go(); R[r]&=~m;C[c]&=~m;B[k]&=~m;a[bi]=0;
      if(n>1)return;
    }
  })();
  return{n,sol:first};
}

/* ---------- 介面 ---------- */
function render(){
  const bad=conflicts(v),g=$('#grid');g.innerHTML='';
  const sr=sel>=0?sel/9|0:-1,sc=sel>=0?sel%9:-1,sv=sel>=0?(v[sel]||(solved?solved[sel]:0)):0,eff=hl||sv,dim=!!solved;
  for(let i=0;i<81;i++){
    const r=i/9|0,c=i%9,d=document.createElement('div'),own=v[i],val=own||(solved?solved[i]:0);
    const given=own&&fx.has(i),match=eff&&val===eff;
    const peer=sel>=0&&(r===sr||c===sc||((r/3|0)===(sr/3|0)&&(c/3|0)===(sc/3|0)));
    d.className='c'+(c%3==2&&c<8?' r3':'')+(r%3==2&&r<8?' b3':'')+(given?' g':val?' ent':'')+(peer?' peer':'')+
      (match&&!(dim&&given)?' same':'')+(dim&&eff&&val&&!match?' dim':'')+(i==hint?' hint':'')+(low.has(i)?' low':'')+(bad.has(i)?' bad':'')+(i==sel?' sel':'');
    d.textContent=val||'';
    d.onclick=()=>{sel=i;render()};
    g.append(d);
  }
}
const pb=[];
for(let n=1;n<=9;n++){const b=document.createElement('button');b.textContent=n;
  b.onclick=()=>{if(mode==='hl'){hl=hl===n?0:n;sync();render()}else setCell(n)};pb.push(b);$('#pad').append(b)}
const pl=document.createElement('button');$('#pad').append(pl);
pl.onclick=()=>{if(mode==='hl'){hl=0;sync();render()}else setCell(0)};
function sync(){pl.textContent=mode==='hl'?'全部':'⌫';pb.forEach((b,i)=>b.classList.toggle('on',mode==='hl'&&hl===i+1))}
function setMode(m){mode=m;if(m==='in')hl=0;$('#mIn').classList.toggle('on',m==='in');$('#mHl').classList.toggle('on',m==='hl');sync()}
$('#mIn').onclick=()=>{setMode('in');render()};$('#mHl').onclick=()=>setMode('hl');
function setCell(n){if(sel<0)return;v[sel]=n;n?fx.add(sel):fx.delete(sel);low.delete(sel);solved=null;render()}
$('#solve').onclick=async()=>{
  if(conflicts(v).size){msg('有重複的數字（紅色），請先修正');return}
  const r=solve(v);
  if(!r.n){msg('無解，請檢查辨識錯誤的格子（橘色是不確定的）');return}
  solved=r.sol;hint=-1;setMode('hl');
  msg(r.n>1?'有多組解（題目數字可能不完整），先顯示其中一組':'解出來了！藍色是解答，點下方數字可以標出同一個數字');
  render();await saveRec(givenStr(),r.sol.join(''),r.n===1?'ok':'check');
};
$('#clr').onclick=()=>{solved=null;hint=-1;render()};
$('#rst').onclick=()=>{v.fill(0);solved=null;low.clear();sel=-1;hint=-1;fx=new Set();setMode('in');$('#prev').hidden=true;msg('');render()};
$('#pick').onclick=()=>$('#file').click();
$('#camBtn').onclick=()=>$('#cam').click();
for(const id of ['#file','#cam'])$(id).onchange=e=>{const fs=[...e.target.files];e.target.value='';if(fs.length>1)batch(fs);else if(fs[0])loadBlob(fs[0])};
addEventListener('paste',e=>{const f=e.clipboardData&&e.clipboardData.files[0];if(f)loadBlob(f)});

/* 提示：先找「只剩一個數字能填」的格子，再找「這個數字在某列/行/宮只有一處能放」，都沒有才直接給答案 */
function cands(i){let m=0x3fe;for(const u of units)if(u.includes(i))for(const j of u)if(v[j])m&=~(1<<v[j]);return m}
function give(i,d,why){v[i]=d;hint=i;sel=-1;solved=null;low.delete(i);msg(`第 ${(i/9|0)+1} 列第 ${i%9+1} 行填 ${d}：${why}`);render()}
$('#hintBtn').onclick=()=>{
  if(conflicts(v).size){msg('有重複的數字（紅色），請先修正再提示');return}
  if(v.every(Boolean)){msg('已經沒有空格了');return}
  for(let i=0;i<81;i++)if(!v[i]){const m=cands(i);if(m&&!(m&(m-1)))return give(i,31-Math.clz32(m),'同列、同行、同宮已經有其他數字，只剩這個能填')}
  for(let u=0;u<units.length;u++)for(let d=1;d<10;d++){
    if(units[u].some(i=>v[i]===d))continue;
    const at=units[u].filter(i=>!v[i]&&(cands(i)>>d&1));
    if(at.length===1)return give(at[0],d,`第 ${(u/3|0)+1} ${['列','行','宮'][u%3]}的 ${d} 只有這一格能放`);
  }
  const r=solve(v);
  if(!r.n){msg('目前的盤面無解，請檢查橘色的格子');return}
  let bi=-1,bc=10;
  for(let i=0;i<81;i++)if(!v[i]){let n=0;for(let t=cands(i);t;t&=t-1)n++;if(n<bc){bc=n;bi=i}}
  give(bi,r.sol[bi],'這步需要進階技巧，直接給答案');
};
$('#copy').onclick=async()=>{
  const b=solved||v,t=[...Array(9)].map((_,r)=>b.slice(r*9,r*9+9).map(x=>x||'.').join(' ')).join('\n');
  try{await navigator.clipboard.writeText(t);msg('已複製'+(solved?'解答':'目前盤面'))}catch(e){msg('這個瀏覽器不讓我複製')}
};

/* 紀錄：存在這個裝置的 IndexedDB（沒有筆數限制，可存縮圖） */
const DB=new Promise((res,rej)=>{
  const q=indexedDB.open('sudoku',1);
  q.onupgradeneeded=()=>{q.result.createObjectStore('puzzles',{keyPath:'id'}).createIndex('given','given')};
  q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);
});
DB.catch(()=>{});
const tx=async(mode,fn)=>{const t=(await DB).transaction('puzzles',mode);let out;const r=fn(t.objectStore('puzzles'));
  return new Promise((res,rej)=>{if(r)r.onsuccess=()=>{out=r.result};t.oncomplete=()=>res(out);t.onerror=t.onabort=()=>rej(t.error)})};
const dbAll=()=>tx('readonly',s=>s.getAll()),dbPut=r=>tx('readwrite',s=>s.put(r)),dbDel=id=>tx('readwrite',s=>s.delete(id)),dbByGiven=g=>tx('readonly',s=>s.index('given').get(g));
const fmt=t=>{const d=new Date(t),p=n=>String(n).padStart(2,'0');return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`};
const ST={ok:'✓ 已解',check:'⚠ 請核對',new:'未解'};
const givenStr=()=>v.map((d,i)=>fx.has(i)?d:0).join('');
function thumb(g,s){
  const c=document.createElement('canvas');c.width=c.height=150;const x=c.getContext('2d'),u=150/9;
  x.fillStyle='#fff';x.fillRect(0,0,150,150);x.textAlign='center';x.textBaseline='middle';
  for(let i=0;i<81;i++){const gd=+g[i],d=gd||+s[i];if(!d)continue;x.font=(gd?'bold ':'')+'13px sans-serif';x.fillStyle=gd?'#222':'#7a9ad0';x.fillText(d,(i%9+.5)*u,((i/9|0)+.5)*u)}
  x.strokeStyle='#999';for(let i=0;i<=9;i++){x.lineWidth=i%3?.5:1.5;x.beginPath();x.moveTo(i*u,0);x.lineTo(i*u,150);x.moveTo(0,i*u);x.lineTo(150,i*u);x.stroke()}
  return c.toDataURL('image/png');
}
async function saveRec(given,sol,status,name){
  try{
    const old=await dbByGiven(given),now=Date.now();
    await dbPut({id:old?old.id:now+'-'+Math.random().toString(36).slice(2,6),given,sol,status,name:name||(old&&old.name)||fmt(now),t:old?old.t:now,u:now,thumb:thumb(given,sol)});
  }catch(e){msg('紀錄存不了（這個瀏覽器不允許儲存）')}
}
async function showRecs(){
  const box=$('#recs'),list=$('#rl');box.hidden=false;
  let rs;try{rs=await dbAll()}catch(e){list.textContent='這個瀏覽器不能存紀錄';return}
  const k=$('#sort').value;
  rs.sort(k==='n'?(a,b)=>a.name.localeCompare(b.name,'zh-TW',{numeric:true}):k==='s'?(a,b)=>a.status<b.status?-1:a.status>b.status?1:b.u-a.u:(a,b)=>b.u-a.u);
  list.textContent=rs.length?'':'還沒有紀錄。解題後會自動存在這個裝置上。';
  for(const h of rs){
    const d=document.createElement('div'),im=new Image(),nm=document.createElement('div'),st=document.createElement('div'),b1=document.createElement('button'),b2=document.createElement('button');
    d.className='rc';im.src=h.thumb;im.onclick=()=>openRec(h);
    nm.className='nm';nm.textContent=h.name;
    nm.onclick=async()=>{const n=prompt('名稱',h.name);if(n&&n.trim()){h.name=n.trim().slice(0,60);await dbPut(h);showRecs()}};
    st.className='st '+h.status;st.textContent=ST[h.status]||'';
    b1.textContent='載入';b1.onclick=()=>openRec(h);
    b2.textContent='刪除';b2.onclick=async()=>{if(confirm('刪除「'+h.name+'」？')){await dbDel(h.id);showRecs()}};
    d.append(im,nm,st,b1,b2);list.append(d);
  }
}
function openRec(h){
  v=[...h.given].map(Number);fx=new Set(v.flatMap((d,i)=>d?[i]:[]));solved=h.sol?[...h.sol].map(Number):null;
  low.clear();hint=-1;sel=-1;$('#recs').hidden=true;setMode(solved?'hl':'in');render();
  msg(`已載入「${h.name}」`+(solved?'，答案也在裡面了':'，按「解題」可以算出答案'));
}
$('#histBtn').onclick=()=>$('#recs').hidden?showRecs():($('#recs').hidden=true);
$('#sort').onchange=showRecs;
$('#exp').onclick=async()=>{
  try{
    const rs=await dbAll(),a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'sudoku',v:1,records:rs})],{type:'application/json'}));
    a.download=`sudoku-records-${new Date().toISOString().slice(0,10)}.json`;a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);msg(`已匯出 ${rs.length} 筆紀錄`);
  }catch(e){msg('匯出失敗')}
};
$('#imp').onclick=()=>$('#impf').click();
$('#impf').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const rs=(JSON.parse(await f.text()).records||[]).filter(r=>r&&/^[0-9]{81}$/.test(r.given));let n=0;
    for(const r of rs){
      if(await dbByGiven(r.given))continue;
      r.id=String(r.id||Date.now()+'-'+n);r.name=String(r.name||'匯入').slice(0,60);r.status=ST[r.status]?r.status:'new';
      r.sol=/^[0-9]{81}$/.test(r.sol)?r.sol:'';r.t=+r.t||Date.now();r.u=+r.u||r.t;
      if(!/^data:image\//.test(r.thumb||''))r.thumb=thumb(r.given,r.sol);
      await dbPut(r);n++;
    }
    msg(`匯入完成：新增 ${n} 筆，${rs.length-n} 筆已經有了`);showRecs();
  }catch(e){msg('這個檔案不是正確的備份檔')}
};
/* 一次選很多張：自動排隊辨識、解題、存進紀錄 */
async function batch(fs){
  let ok=0,chk=0;const fail=[];
  for(let k=0;k<fs.length;k++){
    msg(`批次處理 ${k+1}/${fs.length}…（請不要關掉畫面）`);
    if(!await loadBlob(fs[k],true)){fail.push(fs[k].name);continue}
    const r=solve(v),g=good();
    await saveRec(givenStr(),r.n?r.sol.join(''):'',g?'ok':'check',fs[k].name.replace(/\.[^.]+$/,'').slice(0,60));
    g?ok++:chk++;
  }
  msg(`批次完成：${ok} 張成功、${chk} 張需要核對`+(fail.length?`、${fail.length} 張找不到九宮格（${fail.slice(0,3).join('、')}${fail.length>3?'…':''}）`:'')+'。');
  showRecs();
}
(async()=>{   // 把舊版存在 localStorage 的紀錄搬過來
  try{
    const old=JSON.parse(localStorage.getItem('sudoku-history')||'[]');
    for(const h of old)if(/^[0-9]{81}$/.test(h.k)&&!(await dbByGiven(h.k)))await dbPut({id:'o'+h.t,given:h.k,sol:'',status:'new',name:'舊紀錄 '+fmt(h.t),t:h.t,u:h.t,thumb:thumb(h.k,'')});
    if(old.length)localStorage.removeItem('sudoku-history');
  }catch(e){}
})();

/* ---------- 偵測盤面（等距格線擬合） ---------- */
function prof(g,W,H,vert){
  const n=vert?W:H,m=vert?H:W,P=new Float64Array(n);
  for(let p=1;p<n-1;p++){
    let s=0;
    for(let q=0;q<m;q++){
      const d=Math.abs(vert?g[q*W+p-1]-g[q*W+p+1]:g[(p-1)*W+q]-g[(p+1)*W+q]);
      if(d>6)s+=d>30?30:d;
    }
    P[p]=s;
  }
  return P;
}
function fit(P,smin,smax){
  let best={sc:0},L=P.length;
  for(let s=Math.max(8,smin);s<=smax;s++)for(let p=0;p+9*s<L;p++){
    let sc=0;
    for(let k=0;k<10;k++){let m=0;for(let d=-2;d<=2;d++){const t=P[p+k*s+d]||0;if(t>m)m=t}sc+=m}
    if(sc>best.sc)best={sc,p,s};
  }
  if(best.sc){let mid=0;for(let k=0;k<9;k++)mid+=P[best.p+k*best.s+(best.s>>1)];best.ratio=(best.sc/10)/(mid/9+1)}
  return best;
}
function findBoard(g,W,H){
  const PX=prof(g,W,H,true),PY=prof(g,W,H,false);let fx,fy;
  if(W<=H){fx=fit(PX,Math.floor(W*.05),Math.floor(W/9));fy=fit(PY,fx.s-2,fx.s+2)}
  else{fy=fit(PY,Math.floor(H*.05),Math.floor(H/9));fx=fit(PX,fy.s-2,fy.s+2)}
  if(!(fx.ratio>2&&fy.ratio>2))return null;
  return{x:fx.p,y:fy.p,s:(fx.s+fy.s)/2};
}

/* ---------- 辨識 ---------- */
let img=null,orig=null;
async function getWorker(){
  if(worker)return worker;
  msg('載入辨識引擎…第一次要下載約 10 MB，請稍候');
  const abs=p=>new URL(p,location.href).href;
  const logger=m=>{const nm=/core/.test(m.status||'')?'辨識引擎':/language/.test(m.status||'')?'語言資料':null;if(nm&&/loading/.test(m.status))msg(`載入${nm}… ${Math.round(m.progress*100)}%`)};
  try{worker=await Tesseract.createWorker('eng',1,{workerPath:abs('vendor/worker.min.js'),corePath:abs('vendor/'),langPath:abs('vendor/'),logger})}
  catch(e){worker=await Tesseract.createWorker('eng',1,{logger})}   // 本機檔案載入失敗就改用網路上的版本
  await worker.setParameters({tessedit_char_whitelist:'123456789',tessedit_pageseg_mode:'10'});
  return worker;
}
function setCanvas(o){const cv=$('#prev');cv.width=o.W;cv.height=o.H;cv.getContext('2d').putImageData(o.base,0,0);cv.hidden=false;img=o;o.tap=[]}
function drawBase(){$('#prev').getContext('2d').putImageData(img.base,0,0)}
async function loadBlob(blob,quiet){
  msg('讀取圖片…');
  const bmp=await createImageBitmap(blob), sc=Math.min(1,1200/Math.max(bmp.width,bmp.height));
  const W=Math.round(bmp.width*sc),H=Math.round(bmp.height*sc),cv=document.createElement('canvas');
  cv.width=W;cv.height=H;const x=cv.getContext('2d',{willReadFrequently:true});x.drawImage(bmp,0,0,W,H);
  const base=x.getImageData(0,0,W,H),px=base.data,g=new Uint8Array(W*H);
  for(let i=0;i<W*H;i++)g[i]=.299*px[i*4]+.587*px[i*4+1]+.114*px[i*4+2];
  orig={g,W,H,base};setCanvas(orig);
  msg('尋找九宮格…'); await new Promise(r=>setTimeout(r,30));
  const box=findBoard(g,W,H);
  if(box){await readBoard(box);return true}
  if(!quiet)msg('沒自動找到九宮格。請在上方圖片依序點九宮格的四個角（順序隨意）。');
  return false;
}
/* 手動框選：點四個角，用透視變換拉正（歪斜的照片也可以） */
function homography(src,dst){
  const A=[];
  for(let i=0;i<4;i++){const[x,y]=src[i],[u,w]=dst[i];A.push([x,y,1,0,0,0,-u*x,-u*y,u],[0,0,0,x,y,1,-w*x,-w*y,w])}
  for(let c=0;c<8;c++){
    let p=c;for(let r=c+1;r<8;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;
    [A[c],A[p]]=[A[p],A[c]];
    for(let r=0;r<8;r++)if(r!==c){const f=A[r][c]/A[c][c];for(let k=c;k<9;k++)A[r][k]-=f*A[c][k]}
  }
  return A.map((r,i)=>r[8]/r[i]);
}
function warp(c){
  const N=720,{g,W,H}=orig,h=homography([[0,0],[N,0],[N,N],[0,N]],c),wg=new Uint8Array(N*N),im=new ImageData(N,N);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const z=h[6]*x+h[7]*y+1,sx=(h[0]*x+h[1]*y+h[2])/z,sy=(h[3]*x+h[4]*y+h[5])/z,x0=Math.floor(sx),y0=Math.floor(sy);
    let val=255;
    if(x0>=0&&y0>=0&&x0<W-1&&y0<H-1){
      const fx=sx-x0,fy=sy-y0,i=y0*W+x0;
      val=g[i]*(1-fx)*(1-fy)+g[i+1]*fx*(1-fy)+g[i+W]*(1-fx)*fy+g[i+W+1]*fx*fy;
    }
    const o=y*N+x;wg[o]=val;im.data[o*4]=im.data[o*4+1]=im.data[o*4+2]=val;im.data[o*4+3]=255;
  }
  setCanvas({g:wg,W:N,H:N,base:im});readBoard({x:0,y:0,s:N/9});
}
$('#prev').onclick=e=>{
  if(!img||img!==orig)return;
  const cv=e.target,r=cv.getBoundingClientRect(),x=cv.getContext('2d');
  const pt=[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height];
  img.tap.push(pt);x.fillStyle='#ef4444';x.beginPath();x.arc(pt[0],pt[1],Math.max(5,cv.width/80),0,7);x.fill();
  if(img.tap.length<4){msg(`已點 ${img.tap.length}/4 個角`);return}
  const q=img.tap,sum=q.map(p=>p[0]+p[1]),dif=q.map(p=>p[1]-p[0]);
  warp([q[sum.indexOf(Math.min(...sum))],q[dif.indexOf(Math.min(...dif))],q[sum.indexOf(Math.max(...sum))],q[dif.indexOf(Math.max(...dif))]]);
};
$('#manual').onclick=()=>{if(orig){setCanvas(orig);msg('請在上方圖片依序點九宮格的四個角（順序隨意）')}};
async function ocr(w,cv){
  const cand={},add=(d,c)=>{if(d>='1'&&d<='9'&&!(c<=cand[d]))cand[d]=c};
  for(const psm of ['10','8','13']){          // 先單字模式，不確定就換模式重讀
    await w.setParameters({tessedit_pageseg_mode:psm});
    const r=await w.recognize(cv),t=r.data.text.trim();
    if(t)add(t[0],r.data.confidence);
    for(const sy of r.data.symbols||[])for(const ch of sy.choices||[])add(ch.text,ch.confidence);
    if(Math.max(0,...Object.values(cand))>=75)break;
  }
  return Object.entries(cand).sort((a,b)=>b[1]-a[1]).map(([d,c])=>[+d,c]);
}
function good(){return !conflicts(v).size&&solve(v).n===1}
function repair(cand){                         // 用解題器反推：換掉不確定的格子，直到盤面剛好有唯一解
  if(good())return 0;
  const cells=[...low].sort((a,b)=>((cand[a]||[])[0]||[0,0])[1]-((cand[b]||[])[0]||[0,0])[1]).slice(0,8);
  const orig=cells.map(i=>v[i]);
  const opts=cells.map((i,k)=>{
    const o=(cand[i]||[]).map(c=>c[0]);
    if(!orig[k])for(let d=1;d<10;d++)if(!o.includes(d))o.push(d);
    return o.filter(d=>d!==orig[k]).concat(orig[k]?[0]:[]);
  });
  const apply=l=>{cells.forEach((c,k)=>v[c]=orig[k]);for(const[k,d]of l)v[cells[k]]=d};
  for(let a=0;a<cells.length;a++)for(const da of opts[a]){apply([[a,da]]);if(good())return 1}
  for(let a=0;a<cells.length;a++)for(let b=a+1;b<cells.length;b++)
    for(const da of opts[a])for(const db of opts[b]){apply([[a,da],[b,db]]);if(good())return 2}
  apply([]);return 0;
}
async function readBoard(box){
  const{g,W,H}=img;
  v.fill(0);solved=null;low.clear();sel=-1;hint=-1;fx=new Set();hl=0;render();drawBase();
  const x=$('#prev').getContext('2d');x.strokeStyle='#ef4444';x.lineWidth=Math.max(3,W/200);x.strokeRect(box.x,box.y,box.s*9,box.s*9);
  const w=await getWorker(),cand={},ink=[];
  const t=document.createElement('canvas'),t2=document.createElement('canvas');t2.width=t2.height=72;
  for(let i=0;i<81;i++){
    const r=i/9|0,c=i%9,m=Math.round(box.s*.7),x0=Math.round(box.x+c*box.s+box.s*.15),y0=Math.round(box.y+r*box.s+box.s*.15);
    if(x0<0||y0<0||x0+m>W||y0+m>H)continue;
    let bg=0,nb=0;
    for(let k=0;k<m;k++){for(const [a,b] of [[k,0],[k,m-1],[0,k],[m-1,k]]){bg+=g[(y0+b)*W+x0+a];nb++}}
    bg/=nb;
    let dmax=0;
    for(let yy=0;yy<m;yy++)for(let xx=0;xx<m;xx++)dmax=Math.max(dmax,Math.abs(g[(y0+yy)*W+x0+xx]-bg));
    if(dmax<40)continue;                        // 這格是空的
    const thr=dmax*.5,bin=new ImageData(m,m);let x1=m,y1=m,x2=-1,y2=-1,n=0;
    for(let yy=0;yy<m;yy++)for(let xx=0;xx<m;xx++){
      const on=Math.abs(g[(y0+yy)*W+x0+xx]-bg)>thr,o=(yy*m+xx)*4;
      bin.data[o]=bin.data[o+1]=bin.data[o+2]=on?0:255;bin.data[o+3]=255;
      if(on){n++;if(xx<x1)x1=xx;if(xx>x2)x2=xx;if(yy<y1)y1=yy;if(yy>y2)y2=yy}
    }
    const bw=x2-x1+1,bh=y2-y1+1;
    if(n/(m*m)<.02||bh<m*.25)continue;
    t.width=t.height=m;t.getContext('2d').putImageData(bin,0,0);
    const k=44/Math.max(bw,bh),c2=t2.getContext('2d');   // 裁到數字外框、置中、統一大小
    c2.fillStyle='#fff';c2.fillRect(0,0,72,72);c2.drawImage(t,x1,y1,bw,bh,36-bw*k/2,36-bh*k/2,bw*k,bh*k);
    ink.push(i);cand[i]=await ocr(w,t2);msg(`辨識中… ${ink.length}`);
  }
  for(const i of ink){
    const c=cand[i];
    if(c.length)v[i]=c[0][0];
    if(!c.length||c[0][1]<60)low.add(i);
  }
  const fixed=repair(cand),ok=good();
  msg(`辨識完成，共 ${ink.length} 格有數字。`+(fixed?`已自動修正 ${fixed} 格，`:'')+
    (ok?'盤面檢查通過。':'盤面還有疑慮（數字重複或解不唯一）。')+'橘色是不確定的，點格子再按數字可修正；框歪了或是拍照的圖，可按「手動框選」點四個角。');
  fx=new Set(v.flatMap((d,i)=>d?[i]:[]));setMode('in');render();
}

/* ---------- 啟動 ---------- */
setMode('in');render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
if(location.search.includes('shared')){
  history.replaceState(null,'',location.pathname);
  caches.open('shared').then(c=>c.match('shared-image')).then(r=>r&&r.blob()).then(b=>b&&loadBlob(b));
}
</script>
